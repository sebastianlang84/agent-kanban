<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session workflow · agent-kanban</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafafa;
      --color-ink:    #000000;
      --color-muted:  #717273;
      --color-soft:   #8a8b8c;
      --color-rule:   rgba(0,0,0,0.12);
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
    .note {
      margin-top: 1.25rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--color-rule);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--color-muted);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · agent-kanban</p>
    <h1>One agent session on the board</h1>

    <svg viewBox="0 0 1080 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-title workflow-desc">
      <title id="workflow-title">One agent session on the board</title>
      <desc id="workflow-desc">Swimlane diagram of an agent session: harness hooks register the session, record activity after each answer and mark open tickets when the session ends; the agent checks the board, claims or adds a ticket and closes it; the curator reads the flags on the board.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#717273"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#d90000"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#717273"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <!-- Lane dividers -->
      <line x1="40" y1="80" x2="1040" y2="80" stroke="rgba(0,0,0,0.22)" stroke-width="1"/>
      <line x1="40" y1="160" x2="1040" y2="160" stroke="rgba(0,0,0,0.10)" stroke-width="1"/>
      <line x1="40" y1="240" x2="1040" y2="240" stroke="rgba(0,0,0,0.10)" stroke-width="1"/>
      <line x1="40" y1="320" x2="1040" y2="320" stroke="rgba(0,0,0,0.10)" stroke-width="1"/>
      <line x1="40" y1="400" x2="1040" y2="400" stroke="rgba(0,0,0,0.22)" stroke-width="1"/>
      <line x1="160" y1="80" x2="160" y2="400" stroke="rgba(0,0,0,0.22)" stroke-width="1"/>

      <!-- Lane labels -->
      <text x="56" y="124" fill="#717273" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">HOOKS</text>
      <text x="56" y="204" fill="#717273" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">AGENT</text>
      <text x="56" y="284" fill="#717273" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">BOARD</text>
      <text x="56" y="364" fill="#717273" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CURATOR</text>

      <!-- Arrows (drawn before boxes) -->
      <!-- Start hook registers the session -->
      <line x1="240" y1="144" x2="240" y2="256" stroke="#717273" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Agent reads the board -->
      <line x1="384" y1="260" x2="384" y2="228" stroke="#717273" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Check -> claim -->
      <line x1="444" y1="200" x2="464" y2="200" stroke="#717273" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Claim or add writes the ticket (focal) -->
      <line x1="528" y1="224" x2="528" y2="256" stroke="#d90000" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Stop hook refreshes activity after every answer -->
      <line x1="672" y1="144" x2="672" y2="256" stroke="#717273" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- Work -> close, hopping over the stop-hook line -->
      <path d="M588,200 H664 a8,8 0 0 1 16,0 H752" fill="none" stroke="#717273" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Close writes the closing lines -->
      <line x1="816" y1="224" x2="816" y2="256" stroke="#717273" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- End hook marks open tickets -->
      <line x1="960" y1="144" x2="960" y2="256" stroke="#717273" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Board -> curator -->
      <line x1="960" y1="300" x2="960" y2="332" stroke="#717273" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels (beside vertical segments, 8px gap) -->
      <rect x="248" y="196" width="60" height="12" rx="2" fill="#fafafa"/>
      <text x="252" y="204" fill="#717273" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">REGISTER</text>
      <rect x="392" y="240" width="32" height="12" rx="2" fill="#fafafa"/>
      <text x="396" y="248" fill="#717273" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">READ</text>
      <rect x="536" y="240" width="60" height="12" rx="2" fill="#fafafa"/>
      <text x="540" y="248" fill="#d90000" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">CLAIM/ADD</text>
      <rect x="680" y="220" width="64" height="12" rx="2" fill="#fafafa"/>
      <text x="684" y="228" fill="#717273" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">ACTIVITY</text>
      <rect x="600" y="176" width="40" height="12" rx="2" fill="#fafafa"/>
      <text x="620" y="184" fill="#717273" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WORK</text>
      <rect x="824" y="240" width="40" height="12" rx="2" fill="#fafafa"/>
      <text x="828" y="248" fill="#717273" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">CLOSE</text>
      <rect x="968" y="196" width="68" height="12" rx="2" fill="#fafafa"/>
      <text x="972" y="204" fill="#717273" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">MARK OPEN</text>
      <rect x="968" y="308" width="40" height="12" rx="2" fill="#fafafa"/>
      <text x="972" y="316" fill="#717273" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">FLAGS</text>

      <!-- Hooks lane -->
      <rect x="180" y="96" width="120" height="48" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <text x="240" y="116" fill="#000000" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Start hook</text>
      <text x="240" y="132" fill="#717273" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SessionStart</text>

      <rect x="612" y="96" width="120" height="48" rx="6" fill="rgba(0,0,0,0.02)" stroke="rgba(0,0,0,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="672" y="116" fill="#000000" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stop hook</text>
      <text x="672" y="132" fill="#717273" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">every answer</text>

      <rect x="900" y="96" width="120" height="48" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <text x="960" y="116" fill="#000000" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">End hook</text>
      <text x="960" y="132" fill="#717273" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SessionEnd</text>

      <!-- Agent lane -->
      <rect x="324" y="176" width="120" height="48" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <text x="384" y="196" fill="#000000" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Check board</text>
      <text x="384" y="212" fill="#717273" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">kb board --repo</text>

      <rect x="468" y="176" width="120" height="48" rx="6" fill="rgba(217,0,0,0.07)" stroke="#d90000" stroke-width="1"/>
      <text x="528" y="196" fill="#000000" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Claim or add</text>
      <text x="528" y="212" fill="#717273" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">kb claim · kb add</text>

      <rect x="756" y="176" width="120" height="48" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <text x="816" y="196" fill="#000000" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Close ticket</text>
      <text x="816" y="212" fill="#717273" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">kb close · 3 lines</text>

      <!-- Board lane: one store -->
      <rect x="180" y="260" width="840" height="40" rx="6" fill="rgba(0,0,0,0.05)" stroke="#717273" stroke-width="1"/>
      <text x="200" y="284" fill="#000000" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Board</text>
      <text x="252" y="284" fill="#717273" font-size="8" font-family="'Geist Mono', monospace">sessions · tickets · notes · ~/.local/share/agent-kanban/board.sqlite</text>

      <!-- Curator lane -->
      <rect x="900" y="336" width="120" height="48" rx="6" fill="rgba(113,114,115,0.10)" stroke="#8a8b8c" stroke-width="1"/>
      <text x="960" y="356" fill="#000000" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Read board</text>
      <text x="960" y="372" fill="#717273" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">idle · session-ended</text>

      <!-- Legend -->
      <line x1="40" y1="424" x2="1040" y2="424" stroke="rgba(0,0,0,0.10)" stroke-width="0.8"/>
      <text x="40" y="444" fill="#717273" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="456" width="16" height="12" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <text x="64" y="464" fill="#717273" font-size="8" font-family="'Geist', sans-serif">Step, once per session</text>
      <rect x="200" y="456" width="16" height="12" rx="2" fill="rgba(0,0,0,0.02)" stroke="rgba(0,0,0,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="224" y="464" fill="#717273" font-size="8" font-family="'Geist', sans-serif">Repeats after every answer</text>
      <rect x="376" y="456" width="16" height="12" rx="2" fill="rgba(217,0,0,0.07)" stroke="#d90000" stroke-width="1"/>
      <text x="400" y="464" fill="#717273" font-size="8" font-family="'Geist', sans-serif">Atomic claim — one winner</text>
      <rect x="552" y="456" width="16" height="12" rx="2" fill="rgba(0,0,0,0.05)" stroke="#717273" stroke-width="1"/>
      <text x="576" y="464" fill="#717273" font-size="8" font-family="'Geist', sans-serif">Store</text>
      <line x1="640" y1="460" x2="668" y2="460" stroke="#717273" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="676" y="464" fill="#717273" font-size="8" font-family="'Geist', sans-serif">Write or read</text>
    </svg>

    <p class="note">Hooks write silently and never block. The agent needs no token: kb resolves the session from the harness session id. Windows sessions over ssh have no id and use kb start --as &lt;name&gt; plus --session &lt;token&gt;. Details: docs/workflow.md.</p>
  </div>
</body>
</html>
